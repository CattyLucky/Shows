- type: entity
  parent: BaseComputerAiAccess
  id: ForgePayrollConsole
  name: payroll management console
  description: Used by command staff to manage crew payroll records.
  components:
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: crew
    - map: ["computerLayerKeys"]
      state: command
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: ForgePayrollConsole
  - type: ActivatableUI
    key: enum.ForgePayrollConsoleUiKey.Key
  - type: ActivatableUIRequiresAccess
  - type: AccessReader
    access: [["Captain"], ["HeadOfPersonnel"]]
  - type: UserInterface
    interfaces:
      enum.ForgePayrollConsoleUiKey.Key:
        type: ForgePayrollConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: Computer
    board: ForgePayrollComputerCircuitboard
  - type: PointLight
    radius: 1.5
    energy: 4.0
    color: "#b59b3c"

- type: entity
  parent: BaseComputerCircuitboard
  id: ForgePayrollComputerCircuitboard
  name: payroll management computer board
  description: A computer printed circuit board for a payroll management console.
  components:
  - type: Sprite
    state: cpu_command
  - type: ComputerBoard
    prototype: ForgePayrollConsole
  - type: StaticPrice
    price: 750

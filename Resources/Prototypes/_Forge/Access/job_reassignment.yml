- type: entity
  parent: BaseComputerAiAccess
  id: BaseComputerJobReassignment
  abstract: true
  components:
  - type: JobPresetIdCardConsole
    rankPresets: []
    privilegedIdSlot:
      name: id-card-console-privileged-id
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard
    targetIdSlot:
      name: id-card-console-target-id
      ejectSound: /Audio/Machines/id_swipe.ogg
      insertSound: /Audio/Weapons/Guns/MagIn/batrifle_magin.ogg
      ejectOnBreak: true
      swap: false
      whitelist:
        components:
        - IdCard
  - type: ActivatableUI
    key: enum.JobPresetIdCardConsoleUiKey.Key
  - type: AccessReader
    access: [["Captain"], ["HeadOfPersonnel"]]
  - type: UserInterface
    interfaces:
      enum.JobPresetIdCardConsoleUiKey.Key:
        type: JobPresetConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: PointLight
    radius: 1.5
    energy: 1.6
    color: "#3c5eb5"
  - type: ItemSlots
  - type: ContainerContainer
    containers:
      board: !type:Container
      JobPresetIdCardConsole-privilegedId: !type:ContainerSlot
      JobPresetIdCardConsole-targetId: !type:ContainerSlot

- type: entity
  parent: BaseComputerJobReassignment
  id: ForgeJobReassignmentConsole
  name: job reassignment console
  description: Assigns the selected job to a target ID card or creates a job reassignment injector.
  components:
  - type: JobPresetIdCardConsole
    rankPresets:
    - Captain
    - HeadOfPersonnel
    - ChiefEngineer
    - ChiefMedicalOfficer
    - HeadOfSecurity
    - ResearchDirector
    - Quartermaster
    - Warden
    - SecurityOfficer
    - Detective
    - StationEngineer
    - AtmosphericTechnician
    - MedicalDoctor
    - Paramedic
    - Chemist
    - Scientist
    - SalvageSpecialist
    - CargoTechnician
    - Botanist
    - Chef
    - Bartender
    - Janitor
    - Chaplain
    - Lawyer
    - Librarian
    - Musician
    - Reporter
    - Psychologist
    - ServiceWorker
    - Passenger
    - TechnicalAssistant
    - MedicalIntern
    - ResearchAssistant
    - SecurityCadet
    - Clown
    - Mime
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: id
    - map: ["computerLayerKeys"]
      state: id_key
    - map: [ "enum.WiresVisualLayers.MaintenancePanel" ]
      state: generic_panel_open
  - type: Computer
    board: ForgeJobReassignmentComputerCircuitboard

- type: entity
  parent: BaseComputerCircuitboard
  id: ForgeJobReassignmentComputerCircuitboard
  name: job reassignment computer board
  description: A computer printed circuit board for a job reassignment console.
  components:
  - type: Sprite
    state: cpu_command
  - type: ComputerBoard
    prototype: ForgeJobReassignmentConsole
  - type: StaticPrice
    price: 750

- type: entity
  parent: BaseItem
  id: JobReassignmentInjector
  name: reassignment injector
  description: A disposable injector encoded with a reassignment profile.
  components:
  - type: Sprite
    sprite: Objects/Specific/Medical/implanter.rsi
    state: implanter0
    layers:
    - state: implanter0
    - state: implanter1
  - type: Item
    sprite: Objects/Specific/Medical/implanter.rsi
    heldPrefix: implanter
    size: Small
  - type: JobReassignmentInjector
  - type: Tag
    tags:
    - Trash
  - type: StaticPrice
    price: 35
